name: Go

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"
        type: choice
        options:
          - info
          - warning
          - debug
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23.3"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
            set -e
            cd timetable-be
            git reset --hard HEAD
            git pull origin develop
            chmod +x ./setup.sh
            ./setup.sh

            required_containers=("nginx-timetable" "db_ssh_timetable" "timetable-be-app-1" "db-timetable")
            for container in "${required_containers[@]}"; do
              status=$(docker inspect --format='{{.State.Status}}' "$container" 2>/dev/null || echo "not_found")
              if [ "$status" != "running" ]; then
                echo "Deployment failed: Container '$container' status is '$status'."
                exit 1
              fi
            done
            echo "Deployment succeeded: All required containers are running."
          EOF
